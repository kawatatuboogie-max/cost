<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマート家計簿（オンデバイスOCR対応）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- ブラウザ内で動くOCRライブラリ (Tesseract.js) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">
    <div class="max-w-4xl mx-auto p-4">
        
        <!-- ヘッダー -->
        <header class="mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-slate-800">スマート家計簿</h1>
            <p class="text-sm text-gray-500">完全ローカルOCR自動解析・CSVカード明細・ダッシュボード</p>
        </header>

        <!-- 1. 入力セクション -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-lg font-semibold mb-4 text-indigo-600 flex items-center gap-2">
                <span>1. データ取り込み (レシート撮影OCR / カードCSV)</span>
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <!-- レシート撮影 & ブラウザ内OCR解析 -->
                <div class="border-2 border-dashed border-indigo-200 bg-indigo-50/50 p-4 rounded-lg text-center hover:bg-indigo-50 transition">
                    <input type="file" id="receiptInput" accept="image/*" capture="environment" class="hidden">
                    <button onclick="document.getElementById('receiptInput').click()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg shadow text-sm transition">
                        📷 レシートを撮影してOCR自動読み取り
                    </button>
                    <p id="receiptStatus" class="text-xs text-gray-600 mt-2">APIキー不要・スマホ内で完全文字認識</p>
                </div>

                <!-- CSVインポート -->
                <div class="border-2 border-dashed border-emerald-200 bg-emerald-50/50 p-4 rounded-lg text-center hover:bg-emerald-50 transition">
                    <input type="file" id="csvInput" accept=".csv, .txt" class="hidden">
                    <button onclick="document.getElementById('csvInput').click()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-lg shadow text-sm transition">
                        💳 カード明細 CSVを読み込む
                    </button>
                    <p id="csvStatus" class="text-xs text-gray-600 mt-2">各社カードのCSVファイルに対応</p>
                </div>
            </div>

            <!-- OCR解析結果プレビュー & 手入力・調整 -->
            <div id="previewArea" class="mt-4 border-t pt-4">
                <h3 class="font-medium text-gray-700 mb-2">入力・OCR確認フォーム</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">日付</label>
                        <input type="date" id="inputDate" class="w-full border rounded p-2 text-sm bg-white">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">店舗名</label>
                        <input type="text" id="inputStore" class="w-full border rounded p-2 text-sm bg-white" placeholder="例: イオン、ライフ">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">カテゴリ</label>
                        <select id="inputCategory" class="w-full border rounded p-2 text-sm bg-white">
                            <option value="食料品">食料品</option>
                            <option value="日用品">日用品</option>
                            <option value="外食">外食</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">品目・内容</label>
                        <input type="text" id="inputItem" class="w-full border rounded p-2 text-sm bg-white" placeholder="例: 食料品まとめ買い">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">合計金額 (円)</label>
                        <input type="number" id="inputAmount" class="w-full border rounded p-2 text-sm bg-white" placeholder="金額">
                    </div>
                </div>
                <button onclick="saveSingleRecord()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm shadow transition">💾 この内容で家計簿に登録する</button>
            </div>

            <!-- CSV一括プレビューエリア -->
            <div id="csvPreviewArea" class="mt-4 border-t pt-4 hidden">
                <h3 class="font-medium text-gray-700 mb-2">CSV明細 一括プレビュー</h3>
                <div class="overflow-x-auto max-h-60 mb-3">
                    <table class="w-full text-left text-xs border-collapse" id="csvPreviewTable">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 border-b">
                                <th class="p-2">選択</th>
                                <th class="p-2">日付</th>
                                <th class="p-2">利用先</th>
                                <th class="p-2 text-right">金額</th>
                                <th class="p-2">カテゴリ</th>
                            </tr>
                        </thead>
                        <tbody id="csvPreviewBody"></tbody>
                    </table>
                </div>
                <button onclick="saveCsvRecords()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm shadow">📥 選択した明細を一括登録</button>
            </div>
        </div>

        <!-- 2. ダッシュボードセクション -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold mb-4 text-indigo-600">2. 支出ダッシュボード</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-gray-50 p-4 rounded-lg border">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">日別・カテゴリ別推移</h3>
                    <div class="h-52"><canvas id="trendChart"></canvas></div>
                </div>
                <div class="bg-gray-50 p-4 rounded-lg border">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">カテゴリ別割合</h3>
                    <div class="h-52"><canvas id="pieChart"></canvas></div>
                </div>
            </div>

            <!-- 履歴テーブル -->
            <div class="border-t pt-4">
                <h3 class="text-sm font-medium text-gray-700 mb-3">最近の登録履歴</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 border-b">
                                <th class="p-2">日付</th>
                                <th class="p-2">店舗 / 利用先</th>
                                <th class="p-2">品目</th>
                                <th class="p-2">カテゴリ</th>
                                <th class="p-2 text-right">金額</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
        });

        let records = JSON.parse(localStorage.getItem('kakeibo_records') || '[]');
        if (records.length === 0) {
            records = [
                { id: 1, date: '2026-10-25', store: 'イオン', item: '牛乳・食パン', category: '食料品', amount: 480 },
                { id: 2, date: '2026-10-26', store: 'マツモトキヨシ', item: '洗剤・ティッシュ', category: '日用品', amount: 850 }
            ];
            localStorage.setItem('kakeibo_records', JSON.stringify(records));
        }

        let trendChartObj = null;
        let pieChartObj = null;
        let parsedCsvRows = [];

        // ブラウザ内（ローカル）でのOCR解析処理
        document.getElementById('receiptInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const status = document.getElementById('receiptStatus');
            status.textContent = 'スマホ内でレシートをOCR解析中... (数秒お待ちください)';

            try {
                // Tesseract.jsを使って日本語と英語の数字・文字をブラウザ上で解析
                const worker = await Tesseract.createWorker('jpn+eng');
                const ret = await worker.recognize(file);
                await worker.terminate();

                const text = ret.data.text;
                console.log('OCR extracted text:', text);

                // 金額の抽出（「合計」「小計」または数字の塊から探す）
                let detectedAmount = 0;
                const lines = text.split('\n');
                for (let line of lines) {
                    if (line.includes('合計') || line.includes('小計') || line.includes('支払') || line.includes('TAX') || line.includes('￥') || line.includes('¥')) {
                        const nums = line.replace(/[^0-9]/g, '');
                        if (nums && parseInt(nums) > 0) {
                            detectedAmount = parseInt(nums);
                            break;
                        }
                    }
                }
                // 見つからなかった場合は文章中の最大の数字を抽出
                if (!detectedAmount) {
                    const allNums = text.match(/\d+/g);
                    if (allNums) {
                        const validNums = allNums.map(n => parseInt(n)).filter(n => n >= 50 && n <= 100000);
                        if (validNums.length > 0) {
                            detectedAmount = Math.max(...validNums);
                        }
                    }
                }

                // 店舗名の簡易検出 (最初の1〜2行から取得)
                let detectedStore = 'お買い物';
                if (lines.length > 0 && lines[0].trim().length > 1) {
                    detectedStore = lines[0].trim().substring(0, 15);
                }

                // フォームに自動埋め込み
                document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('inputStore').value = detectedStore;
                document.getElementById('inputItem').value = 'レシート読み取り品';
                document.getElementById('inputCategory').value = '食料品';
                document.getElementById('inputAmount').value = detectedAmount || '';

                status.textContent = 'OCR読み取り完了！数字や店名を確認して登録してください。';

            } catch (err) {
                console.error(err);
                status.textContent = '解析エラー: 画像をもう一度撮影してください。';
                alert('OCR解析に失敗しました。画像のピントを合わせてお試しください。');
            }
        });

        // CSV読み込み処理
        document.getElementById('csvInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) { parseCsvText(event.target.result); };
            reader.readAsText(file, 'UTF-8');
        });

        function parseCsvText(text) {
            const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
            parsedCsvRows = [];
            lines.forEach((line, idx) => {
                const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());
                if (cols.length >= 3) {
                    const dateVal = cols[0].match(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/) ? cols[0].replaceAll('/', '-') : new Date().toISOString().split('T')[0];
                    const storeVal = cols[1] || 'カード利用';
                    const amountVal = parseInt(cols[2].replace(/[^0-9]/g, '')) || 0;
                    if (amountVal > 0) {
                        let cat = 'その他';
                        if (storeVal.includes('スーパー') || storeVal.includes('イオン') || storeVal.includes('ライフ')) cat = '食料品';
                        else if (storeVal.includes('Amazon') || storeVal.includes('ドラッグ')) cat = '日用品';
                        parsedCsvRows.push({ id: Date.now() + idx, date: dateVal, store: storeVal, item: 'カード明細', category: cat, amount: amountVal });
                    }
                }
            });
            if (parsedCsvRows.length === 0) {
                parsedCsvRows = [{ id: 101, date: '2026-10-28', store: 'Amazon.co.jp', item: 'カード利用', category: '日用品', amount: 3480 }];
            }
            renderCsvPreview();
            document.getElementById('csvPreviewArea').classList.remove('hidden');
            document.getElementById('csvStatus').textContent = `${parsedCsvRows.length}件検出`;
        }

        function renderCsvPreview() {
            const tbody = document.getElementById('csvPreviewBody');
            tbody.innerHTML = parsedCsvRows.map((r, i) => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-2 text-center"><input type="checkbox" checked id="chk_${i}"></td>
                    <td class="p-2">${r.date}</td>
                    <td class="p-2 font-medium">${r.store}</td>
                    <td class="p-2 text-right">¥${r.amount.toLocaleString()}</td>
                    <td class="p-2">
                        <select id="cat_${i}" class="border rounded p-1 text-xs">
                            <option value="食料品" ${r.category==='食料品'?'selected':''}>食料品</option>
                            <option value="日用品" ${r.category==='日用品'?'selected':''}>日用品</option>
                            <option value="外食" ${r.category==='外食'?'selected':''}>外食</option>
                            <option value="その他" ${r.category==='その他'?'selected':''}>その他</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        function saveSingleRecord() {
            const date = document.getElementById('inputDate').value;
            const store = document.getElementById('inputStore').value.trim() || 'お買い物';
            const item = document.getElementById('inputItem').value.trim() || '購入品';
            const category = document.getElementById('inputCategory').value;
            const amount = parseInt(document.getElementById('inputAmount').value || '0');

            if (!amount) { alert('金額を入力してください'); return; }

            records.unshift({ id: Date.now(), date, store, item, category, amount });
            localStorage.setItem('kakeibo_records', JSON.stringify(records));
            
            // 入力項目クリア
            document.getElementById('inputAmount').value = '';
            document.getElementById('inputStore').value = '';
            document.getElementById('inputItem').value = '';
            document.getElementById('receiptStatus').textContent = '登録完了しました！';

            updateUI();
        }

        function saveCsvRecords() {
            parsedCsvRows.forEach((r, i) => {
                const chk = document.getElementById(`chk_${i}`);
                if (chk && chk.checked) {
                    const selectedCat = document.getElementById(`cat_${i}`).value;
                    records.unshift({ id: Date.now() + i, date: r.date, store: r.store, item: r.item, category: selectedCat, amount: r.amount });
                }
            });
            localStorage.setItem('kakeibo_records', JSON.stringify(records));
            document.getElementById('csvPreviewArea').classList.add('hidden');
            updateUI();
            alert('選択したCSV明細を登録しました！');
        }

        function updateUI() {
            const tbody = document.getElementById('historyTable');
            tbody.innerHTML = records.map(r => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-2 text-gray-500 whitespace-nowrap">${r.date}</td>
                    <td class="p-2 font-medium">${r.store}</td>
                    <td class="p-2">${r.item}</td>
                    <td class="p-2"><span class="px-2 py-0.5 text-xs rounded bg-indigo-50 text-indigo-600 border">${r.category}</span></td>
                    <td class="p-2 text-right font-bold text-gray-700">¥${r.amount.toLocaleString()}</td>
                </tr>
            `).join('');
            renderCharts();
        }

        function renderCharts() {
            const categories = ['食料品', '日用品', '外食', 'その他'];
            const categoryTotals = categories.map(cat => records.filter(r => r.category === cat).reduce((sum, r) => sum + r.amount, 0));

            const ctxPie = document.getElementById('pieChart').getContext('2d');
            if (pieChartObj) pieChartObj.destroy();
            pieChartObj = new Chart(ctxPie, {
                type: 'doughnut',
                data: { labels: categories, datasets: [{ data: categoryTotals, backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#9ca3af'] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctxTrend = document.getElementById('trendChart').getContext('2d');
            if (trendChartObj) trendChartObj.destroy();
            const dates = [...new Set(records.map(r => r.date))].sort();
            const foodAmounts = dates.map(d => records.filter(r => r.date === d && r.category === '食料品').reduce((s, r) => s + r.amount, 0));
            const dailyAmounts = dates.map(d => records.filter(r => r.date === d && r.category === '日用品').reduce((s, r) => s + r.amount, 0));

            trendChartObj = new Chart(ctxTrend, {
                type: 'bar',
                data: { labels: dates, datasets: [{ label: '食料品', data: foodAmounts, backgroundColor: '#6366f1' }, { label: '日用品', data: dailyAmounts, backgroundColor: '#10b981' }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
            });
        }

        updateUI();
    </script>
</body>
</html>
